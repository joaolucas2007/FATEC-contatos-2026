<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRUD Contatos</title>

  <link rel="stylesheet" href="style.css">
  <script type="module" src="./js/app.js"></script>
</head>

<body>

  <header>
    <h1>Contatos</h1>
  </header>

  <main>

    <section class="form-container">

      <h2 id="form-title">Novo Contato</h2>

      <form id="form-contato">

        <input type="hidden" id="input-id">

        <div class="upload">
          <input type="file" id="preview-input" accept="image/* " >

          <label for="preview-input">
            <img
              src="./image/iconeupload.png"
              alt="Imagem"
              id="preview-image"
            >
          </label>
        </div>

        <input
          type="text"
          id="input-nome"
          placeholder="Nome"
          required
        >

        <input
          type="text"
          id="input-celular"
          placeholder="Celular"
        >

        <input
          type="email"
          id="input-email"
          placeholder="E-mail"
        >

        <input
          type="text"
          id="input-endereco"
          placeholder="Endereço"
        >

        <input
          type="text"
          id="input-cidade"
          placeholder="Cidade"
        >

        <div class="buttons">
          <button type="submit" id="btn-submit">
            Salvar
          </button>

          <button
            type="button"
            id="btn-cancelar"
            style="display:none"
          >
            Cancelar
          </button>
        </div>

      </form>
    </section>

    <section class="list-container">

      <div class="top">
        <h2>Contatos</h2>
        <span id="contador">0 contatos</span>
      </div>

      <input
        type="text"
        id="search-input"
        placeholder="Buscar contato..."
      >

      <div id="contacts-list">

        <div id="cards"></div>

        <div id="empty-state">
          <h3>Nenhum contato encontrado</h3>
        </div>

      </div>

    </section>

  </main>

</body>
</html>
